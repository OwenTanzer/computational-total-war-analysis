[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "computational-total-war-analysis"
version = "0.1.0"
description = "Experimental analyses derived from Computational Total War datasets"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.3,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.8,<2",
  "scipy>=1.17,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

